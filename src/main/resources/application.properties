spring.application.name=pantrypal-backend

# PostgreSQL. The defaults match docker-compose.yml, so `docker compose up -d` is enough for local development.
# Override them with environment variables anywhere else (and never keep the default password outside your machine).
spring.datasource.url=${PANTRYPAL_DB_URL:jdbc:postgresql://localhost:5432/pantrypal}
spring.datasource.username=${PANTRYPAL_DB_USER:pantrypal}
spring.datasource.password=${PANTRYPAL_DB_PASSWORD:pantrypal}

# The schema is owned by the Flyway migrations in src/main/resources/db/migration. Hibernate only checks that the
# entities match it and refuses to start otherwise; it must never create, alter or drop tables.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

pantrypal.ollama.base-url=http://localhost:11434
pantrypal.ollama.model=llama3.2
pantrypal.ollama.vision-model=gemma3:4b

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Never put stack traces, exception names or internal messages into HTTP error bodies (Spring DevTools turns the
# stack trace on by default, which leaks code paths to anyone who can trigger an error).
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Emails (verifying an address, resetting a password). Without an SMTP server they are only written to the log, which
# is for development. To send real ones set SPRING_MAIL_HOST (and SPRING_MAIL_PORT, _USERNAME, _PASSWORD as needed).
# The links in them point at the frontend, so set PANTRYPAL_PUBLIC_URL to wherever the frontend is served.
pantrypal.public-url=${PANTRYPAL_PUBLIC_URL:http://localhost:5173}
pantrypal.mail.from=${PANTRYPAL_MAIL_FROM:no-reply@pantrypal.local}
# Logging in needs a confirmed email address. PANTRYPAL_REQUIRE_VERIFIED_EMAIL=false turns that off (development).
pantrypal.security.require-verified-email=${PANTRYPAL_REQUIRE_VERIFIED_EMAIL:true}

# HTTPS. PANTRYPAL_REQUIRE_HTTPS=true is the one switch for a deployment: plain-HTTP requests are refused (403),
# cookies are marked Secure, and the application refuses to start if nothing provides TLS (HttpsSettingsCheck). TLS comes
# either from the application (server.ssl.bundle=..., see the README) or from a reverse proxy in front of it, in which
# case also set PANTRYPAL_FORWARD_HEADERS=native so that the proxy's X-Forwarded-Proto / X-Forwarded-For are believed
# (only when they come from a private or loopback address, Tomcat's default). The same setting makes the per-address
# rate limits see the real client address instead of the proxy's.
pantrypal.security.require-https=${PANTRYPAL_REQUIRE_HTTPS:false}
server.forward-headers-strategy=${PANTRYPAL_FORWARD_HEADERS:none}

# Login sessions. The session cookie can't be read by scripts on a page (HttpOnly) and isn't sent along with
# requests started by other sites (SameSite=Lax). Set PANTRYPAL_COOKIE_SECURE=true wherever the app is served over
# HTTPS, so the browser never sends the cookies over plain HTTP; it defaults to false only so http://localhost works.
pantrypal.security.cookie-secure=${PANTRYPAL_COOKIE_SECURE:${pantrypal.security.require-https}}
server.servlet.session.cookie.name=PANTRYPAL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${pantrypal.security.cookie-secure}
server.servlet.session.timeout=8h

# Sessions are stored in PostgreSQL (tables created by the Flyway migration, not by Spring Session). The idle timeout
# is the server.servlet.session.timeout above; expired sessions are deleted every minute.
spring.session.jdbc.initialize-schema=never
