spring.application.name=pantrypal-backend

# PostgreSQL. The defaults match docker-compose.yml, so `docker compose up -d` is enough for local development.
# Override them with environment variables anywhere else (and never keep the default password outside your machine).
spring.datasource.url=${PANTRYPAL_DB_URL:jdbc:postgresql://localhost:5432/pantrypal}
spring.datasource.username=${PANTRYPAL_DB_USER:pantrypal}
spring.datasource.password=${PANTRYPAL_DB_PASSWORD:pantrypal}

# The schema is owned by the Flyway migrations in src/main/resources/db/migration. Hibernate only checks that the
# entities match it and refuses to start otherwise; it must never create, alter or drop tables.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

pantrypal.ollama.base-url=http://localhost:11434
pantrypal.ollama.model=llama3.2
pantrypal.ollama.vision-model=gemma3:4b

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Never put stack traces, exception names or internal messages into HTTP error bodies (Spring DevTools turns the
# stack trace on by default, which leaks code paths to anyone who can trigger an error).
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
